name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run ci
      - name: Smoke-test the runtime ZIP
        if: matrix.node == '24'
        run: |
          runtime="$RUNNER_TEMP/health-checks-runtime"
          unzip -q dist/health-checks-*.zip -d "$runtime"
          npm --prefix "$runtime" ci --omit=dev --ignore-scripts --no-audit --no-fund
          node "$runtime/health-check.js" --version
          node "$runtime/health-check.js" --check-config --config "$runtime/config.json.sample"
      - name: Upload the runtime ZIP
        if: matrix.node == '24'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/health-checks-*.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
